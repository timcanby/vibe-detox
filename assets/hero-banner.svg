<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#f778ba"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)" rx="16"/>
  <!-- terminal dots -->
  <circle cx="40" cy="40" r="8" fill="#ff5f56"/>
  <circle cx="64" cy="40" r="8" fill="#ffbd2e"/>
  <circle cx="88" cy="40" r="8" fill="#27c93f"/>
  <!-- title -->
  <text x="600" y="160" font-family="ui-monospace,SFMono-Regular,monospace" font-size="64" font-weight="bold" fill="url(#accent)" text-anchor="middle" letter-spacing="2">Vibe Detox</text>
  <!-- slogan -->
  <text x="600" y="210" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24" fill="#8b949e" text-anchor="middle" font-style="italic">Vibe responsibly. Know what your code is doing.</text>
  <!-- underline accent -->
  <rect x="400" y="235" width="400" height="4" fill="url(#accent)" rx="2" opacity="0.6"/>
  <!-- code symbols floating -->
  <text x="150" y="130" font-family="ui-monospace,monospace" font-size="28" fill="#30363d" opacity="0.5">&lt;/&gt;</text>
  <text x="980" y="130" font-family="ui-monospace,monospace" font-size="28" fill="#30363d" opacity="0.5">{ }</text>
  <text x="120" y="250" font-family="ui-monospace,monospace" font-size="20" fill="#30363d" opacity="0.4">AI != understanding</text>
  <text x="900" y="250" font-family="ui-monospace,monospace" font-size="20" fill="#30363d" opacity="0.4">abstract != ignore</text>
</svg>