<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#8957e5"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f778ba"/>
      <stop offset="100%" stop-color="#db61a2"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7b72"/>
      <stop offset="100%" stop-color="#da3633"/>
    </linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffa657"/>
      <stop offset="100%" stop-color="#e8872d"/>
    </linearGradient>
    <linearGradient id="g6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ee787"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
  </defs>
  <rect width="900" height="520" fill="#0d1117" rx="16"/>

  <!-- arrows (circular) -->
  <path d="M 280 130 Q 450 90 620 130" stroke="#30363d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 750 160 Q 830 260 750 360" stroke="#30363d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 620 390 Q 450 430 280 390" stroke="#30363d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 150 360 Q 70 260 150 160" stroke="#30363d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#30363d"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <circle cx="220" cy="130" r="55" fill="url(#g1)"/>
  <text x="220" y="125" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">STEP 1</text>
  <text x="220" y="145" font-family="ui-sans-serif,sans-serif" font-size="14" fill="#fff" text-anchor="middle">Explain</text>
  <text x="220" y="215" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Explain the concept</text>
  <text x="220" y="230" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">from memory</text>

  <!-- Step 2 -->
  <circle cx="680" cy="130" r="55" fill="url(#g2)"/>
  <text x="680" y="125" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">STEP 2</text>
  <text x="680" y="145" font-family="ui-sans-serif,sans-serif" font-size="14" fill="#fff" text-anchor="middle">Implement</text>
  <text x="680" y="215" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Implement without</text>
  <text x="680" y="230" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">AI assistance</text>

  <!-- Step 3 -->
  <circle cx="780" cy="260" r="55" fill="url(#g3)"/>
  <text x="780" y="255" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">STEP 3</text>
  <text x="780" y="275" font-family="ui-sans-serif,sans-serif" font-size="14" fill="#fff" text-anchor="middle">Identify</text>

  <!-- Step 4 -->
  <circle cx="680" cy="390" r="55" fill="url(#g4)"/>
  <text x="680" y="385" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">STEP 4</text>
  <text x="680" y="405" font-family="ui-sans-serif,sans-serif" font-size="14" fill="#fff" text-anchor="middle">Relearn</text>

  <!-- Step 5 -->
  <circle cx="220" cy="390" r="55" fill="url(#g5)"/>
  <text x="220" y="385" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">STEP 5</text>
  <text x="220" y="405" font-family="ui-sans-serif,sans-serif" font-size="14" fill="#fff" text-anchor="middle">Reimplement</text>

  <!-- Step 6 -->
  <circle cx="120" cy="260" r="55" fill="url(#g6)"/>
  <text x="120" y="255" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">STEP 6</text>
  <text x="120" y="275" font-family="ui-sans-serif,sans-serif" font-size="14" fill="#fff" text-anchor="middle">Document</text>

  <!-- center label -->
  <text x="450" y="255" font-family="ui-sans-serif,sans-serif" font-size="16" font-weight="bold" fill="#8b949e" text-anchor="middle">The Detox</text>
  <text x="450" y="275" font-family="ui-sans-serif,sans-serif" font-size="16" font-weight="bold" fill="#8b949e" text-anchor="middle">Cycle</text>

  <text x="450" y="490" font-family="ui-sans-serif,sans-serif" font-size="14" fill="#58a6ff" text-anchor="middle" font-style="italic">Try from memory first. Use AI later.</text>
</svg>