<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <rect width="800" height="420" fill="#0d1117" rx="16"/>
  <text x="400" y="35" font-family="ui-sans-serif,sans-serif" font-size="20" font-weight="bold" fill="#58a6ff" text-anchor="middle">FastAPI = Starlette + Pydantic + Auto-Docs</text>

  <!-- Request flow -->
  <rect x="30" y="65" width="120" height="50" fill="#161b22" stroke="#bc8cff" rx="8"/>
  <text x="90" y="95" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#bc8cff" text-anchor="middle">Request</text>

  <line x1="150" y1="90" x2="195" y2="90" stroke="#30363d" stroke-width="2" marker-end="url(#fa)"/>
  <defs><marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#30363d"/></marker></defs>

  <!-- Pydantic validation -->
  <rect x="200" y="65" width="180" height="50" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="8"/>
  <text x="290" y="88" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#ffa657" text-anchor="middle">Pydantic</text>
  <text x="290" y="105" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">validate & type</text>

  <line x1="380" y1="90" x2="425" y2="90" stroke="#30363d" stroke-width="2" marker-end="url(#fa)"/>

  <!-- Async route -->
  <rect x="430" y="65" width="170" height="50" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="8"/>
  <text x="515" y="88" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#7ee787" text-anchor="middle">async def route</text>
  <text x="515" y="105" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">await I/O (DB, LLM)</text>

  <line x1="600" y1="90" x2="645" y2="90" stroke="#30363d" stroke-width="2" marker-end="url(#fa)"/>

  <!-- Response -->
  <rect x="650" y="65" width="120" height="50" fill="#161b22" stroke="#bc8cff" rx="8"/>
  <text x="710" y="88" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#bc8cff" text-anchor="middle">Response</text>
  <text x="710" y="105" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">typed + serialized</text>

  <!-- Starlette layer -->
  <rect x="200" y="140" width="400" height="35" fill="#1c1e26" stroke="#f778ba" stroke-width="1" rx="6"/>
  <text x="400" y="163" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#f778ba" text-anchor="middle">Starlette (ASGI — async web server layer)</text>

  <!-- Auto docs -->
  <rect x="200" y="195" width="180" height="60" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="8"/>
  <text x="290" y="220" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#7ee787" text-anchor="middle">Auto OpenAPI</text>
  <text x="290" y="238" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e" text-anchor="middle">/docs (Swagger UI)</text>
  <text x="290" y="252" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e" text-anchor="middle">/openapi.json</text>

  <!-- DI -->
  <rect x="420" y="195" width="180" height="60" fill="#161b22" stroke="#bc8cff" stroke-width="2" rx="8"/>
  <text x="510" y="220" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#bc8cff" text-anchor="middle">Dependency Injection</text>
  <text x="510" y="238" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e" text-anchor="middle">Depends(get_db)</text>
  <text x="510" y="252" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e" text-anchor="middle">scoped lifetimes</text>

  <!-- Async benefit -->
  <rect x="80" y="290" width="640" height="100" fill="#1c1e26" stroke="#58a6ff" stroke-width="2" rx="10"/>
  <text x="400" y="315" font-family="ui-sans-serif,sans-serif" font-size="15" font-weight="bold" fill="#58a6ff" text-anchor="middle">Why async matters for AI</text>
  <text x="400" y="340" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#e6edf3" text-anchor="middle">LLM call takes 2-5 seconds. Sync: 1 request = 1 blocked worker.</text>
  <text x="400" y="360" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#7ee787" text-anchor="middle">Async: await call_llm() → other requests served while waiting.</text>
  <text x="400" y="380" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#bc8cff" text-anchor="middle" font-style="italic">One server handles thousands of concurrent LLM calls.</text>
</svg>