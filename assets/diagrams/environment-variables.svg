<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#0d1117" rx="16"/>
  <text x="400" y="35" font-family="ui-sans-serif,sans-serif" font-size="20" font-weight="bold" fill="#58a6ff" text-anchor="middle">Environment Variables & Secrets</text>

  <!-- Local -->
  <rect x="50" y="70" width="220" height="200" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="10"/>
  <text x="160" y="95" font-family="ui-sans-serif,sans-serif" font-size="14" font-weight="bold" fill="#7ee787" text-anchor="middle">Local Dev</text>
  <text x="65" y="120" font-family="ui-monospace,monospace" font-size="10" fill="#e6edf3">.env.local</text>
  <text x="65" y="138" font-family="ui-monospace,monospace" font-size="9" fill="#8b949e">(gitignored)</text>
  <text x="65" y="165" font-family="ui-monospace,monospace" font-size="9" fill="#bc8cff">NEXT_PUBLIC_</text>
  <text x="65" y="178" font-family="ui-monospace,monospace" font-size="9" fill="#bc8cff">  CLERK_PUB_KEY=pk_</text>
  <text x="65" y="198" font-family="ui-monospace,monospace" font-size="9" fill="#f778ba">CLERK_SECRET_KEY=sk_</text>
  <text x="65" y="218" font-family="ui-monospace,monospace" font-size="9" fill="#ffa657">CLERK_JWT_URL=https://</text>
  <text x="160" y="250" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#7ee787" text-anchor="middle">gitignored, never pushed</text>

  <!-- Vercel -->
  <rect x="290" y="70" width="220" height="200" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="10"/>
  <text x="400" y="95" font-family="ui-sans-serif,sans-serif" font-size="14" font-weight="bold" fill="#58a6ff" text-anchor="middle">Vercel</text>
  <text x="305" y="120" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#8b949e">Dashboard / CLI</text>
  <text x="305" y="145" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#e6edf3">vercel env add KEY</text>
  <text x="305" y="170" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#e6edf3">Select environment:</text>
  <text x="305" y="190" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#7ee787">  Production</text>
  <text x="305" y="208" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#7ee787">  Preview</text>
  <text x="305" y="226" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#7ee787">  Development</text>
  <text x="400" y="250" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle">For deployed app</text>

  <!-- Code -->
  <rect x="530" y="70" width="220" height="200" fill="#161b22" stroke="#bc8cff" stroke-width="2" rx="10"/>
  <text x="640" y="95" font-family="ui-sans-serif,sans-serif" font-size="14" font-weight="bold" fill="#bc8cff" text-anchor="middle">Your Code</text>
  <text x="545" y="125" font-family="ui-monospace,monospace" font-size="10" fill="#e6edf3">// Frontend (TSX)</text>
  <text x="545" y="142" font-family="ui-monospace,monospace" font-size="9" fill="#7ee787">process.env.</text>
  <text x="545" y="156" font-family="ui-monospace,monospace" font-size="9" fill="#7ee787">  NEXT_PUBLIC_KEY</text>
  <text x="545" y="180" font-family="ui-monospace,monospace" font-size="10" fill="#e6edf3"># Backend (Python)</text>
  <text x="545" y="197" font-family="ui-monospace,monospace" font-size="9" fill="#ffa657">os.environ.get(</text>
  <text x="545" y="211" font-family="ui-monospace,monospace" font-size="9" fill="#ffa657">  "CLERK_JWT_URL")</text>
  <text x="640" y="250" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#bc8cff" text-anchor="middle">Reads from env</text>

  <!-- Arrows -->
  <defs><marker id="ea" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#30363d"/></marker></defs>
  <line x1="270" y1="170" x2="530" y2="155" stroke="#7ee787" stroke-width="1" stroke-dasharray="4" marker-end="url(#ea)"/>
  <line x1="510" y1="170" x2="530" y2="180" stroke="#58a6ff" stroke-width="1" stroke-dasharray="4" marker-end="url(#ea)"/>

  <!-- Rules -->
  <rect x="50" y="295" width="700" height="85" fill="#1c1e26" stroke="#f778ba" stroke-width="1" rx="8"/>
  <text x="400" y="320" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#ff7b72" text-anchor="middle">NEXT_PUBLIC_ prefix = exposed to browser (safe for publishable keys only)</text>
  <text x="400" y="340" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#7ee787" text-anchor="middle">No prefix = server-only (secret keys, JWT URLs)</text>
  <text x="400" y="365" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle" font-style="italic">Must set keys on BOTH .env.local AND Vercel — missing either = broken auth</text>
</svg>