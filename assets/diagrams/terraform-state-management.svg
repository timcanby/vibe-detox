<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#0d1117" rx="16"/>
  <text x="400" y="35" font-family="ui-sans-serif,sans-serif" font-size="20" font-weight="bold" fill="#58a6ff" text-anchor="middle">Terraform State — The Bridge Between Code and Reality</text>

  <!-- Code -->
  <rect x="30" y="70" width="180" height="80" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="8"/>
  <text x="120" y="95" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="bold" fill="#7ee787" text-anchor="middle">.tf files</text>
  <text x="120" y="115" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">What SHOULD exist</text>
  <text x="120" y="135" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#7ee787" text-anchor="middle">(desired state)</text>

  <!-- State -->
  <rect x="310" y="70" width="180" height="80" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="8"/>
  <text x="400" y="95" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="bold" fill="#ffa657" text-anchor="middle">terraform.tfstate</text>
  <text x="400" y="115" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">What DOES exist</text>
  <text x="400" y="135" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#ffa657" text-anchor="middle">(actual state)</text>

  <!-- Reality -->
  <rect x="590" y="70" width="180" height="80" fill="#161b22" stroke="#f778ba" stroke-width="2" rx="8"/>
  <text x="680" y="95" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="bold" fill="#f778ba" text-anchor="middle">AWS (real world)</text>
  <text x="680" y="115" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">S3, Lambda, etc.</text>
  <text x="680" y="135" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#f778ba" text-anchor="middle">(live resources)</text>

  <!-- Arrows -->
  <defs><marker id="sa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#30363d"/></marker></defs>
  <line x1="210" y1="110" x2="310" y2="110" stroke="#30363d" stroke-width="2" marker-end="url(#sa)"/>
  <text x="260" y="100" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">diff</text>
  <line x1="490" y1="110" x2="590" y2="110" stroke="#30363d" stroke-width="2" marker-end="url(#sa)"/>
  <text x="540" y="100" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">API calls</text>

  <!-- Storage -->
  <rect x="250" y="180" width="300" height="60" fill="#1c1e26" stroke="#ff7b72" stroke-width="1" rx="8"/>
  <text x="400" y="205" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#ff7b72" text-anchor="middle">State storage rules:</text>
  <text x="400" y="225" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Local (.tfstate) = solo only. Remote (S3+DynamoDB) = teams.</text>

  <!-- Gitignore -->
  <rect x="100" y="270" width="280" height="100" fill="#1c1e26" stroke="#ff7b72" rx="8"/>
  <text x="240" y="295" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#ff7b72" text-anchor="middle">.gitignore (NOT in git)</text>
  <text x="115" y="318" font-family="ui-monospace,monospace" font-size="10" fill="#e6edf3">*.tfstate</text>
  <text x="115" y="335" font-family="ui-monospace,monospace" font-size="10" fill="#e6edf3">.terraform/</text>
  <text x="115" y="352" font-family="ui-monospace,monospace" font-size="10" fill="#e6edf3">*.tfvars (secrets!)</text>

  <rect x="420" y="270" width="280" height="100" fill="#1c1e26" stroke="#7ee787" rx="8"/>
  <text x="560" y="295" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#7ee787" text-anchor="middle">DO commit to git</text>
  <text x="435" y="318" font-family="ui-monospace,monospace" font-size="10" fill="#e6edf3">!terraform.tfvars (defaults)</text>
  <text x="435" y="335" font-family="ui-monospace,monospace" font-size="10" fill="#e6edf3">.terraform.lock.hcl</text>
  <text x="435" y="352" font-family="ui-monospace,monospace" font-size="10" fill="#e6edf3">all .tf files</text>
</svg>