<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0d1117" rx="16"/>
  <text x="400" y="35" font-family="ui-sans-serif,sans-serif" font-size="20" font-weight="bold" fill="#58a6ff" text-anchor="middle">Reconciliation: The Diff & Patch Engine</text>

  <!-- Step 1 -->
  <rect x="280" y="60" width="240" height="45" fill="#161b22" stroke="#bc8cff" stroke-width="2" rx="8"/>
  <text x="400" y="88" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#bc8cff" text-anchor="middle">① State changes</text>

  <line x1="400" y1="108" x2="400" y2="128" stroke="#30363d" stroke-width="2" marker-end="url(#ar2)"/>
  <defs><marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#30363d"/></marker></defs>

  <!-- Step 2: Two trees -->
  <text x="200" y="155" font-family="ui-sans-serif,sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">Previous Tree</text>
  <text x="600" y="155" font-family="ui-sans-serif,sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">New Tree</text>

  <!-- Old tree -->
  <rect x="160" y="170" width="60" height="35" fill="#161b22" stroke="#f778ba" rx="5"/>
  <text x="190" y="192" font-family="ui-monospace,monospace" font-size="11" fill="#f778ba" text-anchor="middle"><div></text>
  <line x1="190" y1="205" x2="150" y2="225" stroke="#30363d"/><line x1="190" y1="205" x2="230" y2="225" stroke="#30363d"/>
  <rect x="120" y="225" width="60" height="35" fill="#161b22" stroke="#f778ba" rx="5"/>
  <text x="150" y="247" font-family="ui-monospace,monospace" font-size="10" fill="#f778ba" text-anchor="middle"><h1></text>
  <rect x="200" y="225" width="60" height="35" fill="#161b22" stroke="#f778ba" rx="5"/>
  <text x="230" y="247" font-family="ui-monospace,monospace" font-size="10" fill="#f778ba" text-anchor="middle"><p></text>
  <text x="230" y="275" font-family="ui-monospace,monospace" font-size="10" fill="#ff7b72" text-anchor="middle">"Old text"</text>

  <!-- New tree -->
  <rect x="560" y="170" width="60" height="35" fill="#161b22" stroke="#7ee787" rx="5"/>
  <text x="590" y="192" font-family="ui-monospace,monospace" font-size="11" fill="#7ee787" text-anchor="middle"><div></text>
  <line x1="590" y1="205" x2="550" y2="225" stroke="#30363d"/><line x1="590" y1="205" x2="630" y2="225" stroke="#30363d"/>
  <rect x="520" y="225" width="60" height="35" fill="#161b22" stroke="#7ee787" rx="5"/>
  <text x="550" y="247" font-family="ui-monospace,monospace" font-size="10" fill="#7ee787" text-anchor="middle"><h1></text>
  <rect x="600" y="225" width="60" height="35" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="5"/>
  <text x="630" y="247" font-family="ui-monospace,monospace" font-size="10" fill="#ffa657" text-anchor="middle"><p></text>
  <text x="630" y="275" font-family="ui-monospace,monospace" font-size="10" fill="#7ee787" text-anchor="middle">"New text" ✓</text>

  <!-- Diff arrow -->
  <text x="400" y="210" font-family="ui-sans-serif,sans-serif" font-size="28" fill="#bc8cff" text-anchor="middle">⟷</text>
  <text x="400" y="235" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">DIFF</text>

  <line x1="400" y1="290" x2="400" y2="310" stroke="#30363d" stroke-width="2" marker-end="url(#ar2)"/>

  <!-- Step 3 -->
  <rect x="250" y="315" width="300" height="45" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="8"/>
  <text x="400" y="343" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#ffa657" text-anchor="middle">② Compute minimal patch</text>

  <line x1="400" y1="363" x2="400" y2="383" stroke="#30363d" stroke-width="2" marker-end="url(#ar2)"/>

  <!-- Step 4 -->
  <rect x="250" y="388" width="300" height="45" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="8"/>
  <text x="400" y="416" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#7ee787" text-anchor="middle">③ Apply only changed DOM nodes</text>

  <text x="400" y="460" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#8b949e" text-anchor="middle" font-style="italic">Like git diff for UI — patch only what changed</text>
  <text x="400" y="480" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#58a6ff" text-anchor="middle">Keys give elements stable identity across reorders</text>
</svg>