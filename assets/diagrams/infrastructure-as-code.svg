<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380">
  <rect width="800" height="380" fill="#0d1117" rx="16"/>
  <text x="400" y="35" font-family="ui-sans-serif,sans-serif" font-size="20" font-weight="bold" fill="#58a6ff" text-anchor="middle">Infrastructure as Code</text>

  <!-- Manual -->
  <rect x="50" y="70" width="320" height="200" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="10"/>
  <text x="210" y="95" font-family="ui-sans-serif,sans-serif" font-size="14" font-weight="bold" fill="#ff7b72" text-anchor="middle">ClickOps (manual)</text>
  <text x="65" y="125" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#8b949e">1. Click through 20 AWS screens</text>
  <text x="65" y="145" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#8b949e">2. Type bucket names (typos = breaks)</text>
  <text x="65" y="165" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#8b949e">3. Set permissions manually</text>
  <text x="65" y="185" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#8b949e">4. Repeat for every environment</text>
  <text x="65" y="215" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#ff7b72" text-anchor="start">Not reproducible, not versioned</text>
  <text x="65" y="235" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#ff7b72" text-anchor="start">No review, no undo, no history</text>
  <text x="65" y="255" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#ff7b72" text-anchor="start">Who opened port 22? ???</text>

  <!-- IaC -->
  <rect x="430" y="70" width="320" height="200" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="10"/>
  <text x="590" y="95" font-family="ui-sans-serif,sans-serif" font-size="14" font-weight="bold" fill="#7ee787" text-anchor="middle">IaC (Terraform)</text>
  <text x="445" y="125" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e">resource "aws_s3_bucket" "mem" {</text>
  <text x="455" y="143" font-family="ui-monospace,monospace" font-size="11" fill="#7ee787">  bucket = "${var.prefix}-mem"</text>
  <text x="455" y="161" font-family="ui-monospace,monospace" font-size="11" fill="#7ee787">  region = "us-east-1"</text>
  <text x="445" y="179" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e">}</text>
  <text x="445" y="205" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#7ee787" text-anchor="start">Versioned in git, PR-reviewed</text>
  <text x="445" y="225" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#7ee787" text-anchor="start">terraform apply = vending machine</text>
  <text x="445" y="245" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#7ee787" text-anchor="start">Same code for dev/test/prod</text>
  <text x="445" y="265" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#7ee787" text-anchor="start">terraform destroy = clean up</text>

  <!-- Bottom -->
  <text x="400" y="310" font-family="ui-sans-serif,sans-serif" font-size="14" fill="#bc8cff" text-anchor="middle">Write once, apply anywhere, destroy cleanly</text>
  <text x="400" y="335" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#58a6ff" text-anchor="middle" font-style="italic">Like a vending machine: select what you want, press button, infrastructure pops out</text>
  <text x="400" y="360" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Terraform (HCL) · AWS CDK (TS/Py) · Pulumi (TS/Py) · CloudFormation (YAML)</text>
</svg>