<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#0d1117" rx="16"/>
  <text x="400" y="35" font-family="ui-sans-serif,sans-serif" font-size="20" font-weight="bold" fill="#58a6ff" text-anchor="middle">Transpiling & Bundling Pipeline</text>

  <!-- Source -->
  <rect x="30" y="70" width="150" height="100" fill="#161b22" stroke="#bc8cff" stroke-width="2" rx="8"/>
  <text x="105" y="95" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="bold" fill="#bc8cff" text-anchor="middle">Your Source</text>
  <text x="105" y="115" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf3" text-anchor="middle">.tsx files</text>
  <text x="105" y="133" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf3" text-anchor="middle">TypeScript</text>
  <text x="105" y="151" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf3" text-anchor="middle">+ JSX syntax</text>
  <text x="105" y="165" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">~200 files, 1.5MB</text>

  <!-- Arrow -->
  <line x1="185" y1="120" x2="230" y2="120" stroke="#30363d" stroke-width="3" marker-end="url(#ta)"/>
  <defs><marker id="ta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#30363d"/></marker></defs>

  <!-- Transpiler -->
  <rect x="235" y="70" width="170" height="100" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="8"/>
  <text x="320" y="95" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="bold" fill="#ffa657" text-anchor="middle">Transpiler</text>
  <text x="320" y="115" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf3" text-anchor="middle">SWC / Babel</text>
  <text x="320" y="133" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">TS types → stripped</text>
  <text x="320" y="148" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">JSX → createElement</text>
  <text x="320" y="163" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Modern → compatible</text>

  <!-- Arrow -->
  <line x1="410" y1="120" x2="455" y2="120" stroke="#30363d" stroke-width="3" marker-end="url(#ta)"/>

  <!-- Bundler -->
  <rect x="460" y="70" width="170" height="100" fill="#161b22" stroke="#f778ba" stroke-width="2" rx="8"/>
  <text x="545" y="95" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="bold" fill="#f778ba" text-anchor="middle">Bundler</text>
  <text x="545" y="115" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf3" text-anchor="middle">Turbopack / webpack</text>
  <text x="545" y="133" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Tree-shake unused</text>
  <text x="545" y="148" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Code-split per route</text>
  <text x="545" y="163" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Minify & compress</text>

  <!-- Arrow -->
  <line x1="635" y1="120" x2="680" y2="120" stroke="#30363d" stroke-width="3" marker-end="url(#ta)"/>

  <!-- Output -->
  <rect x="685" y="70" width="100" height="100" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="8"/>
  <text x="735" y="95" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="bold" fill="#7ee787" text-anchor="middle">Output</text>
  <text x="735" y="115" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf3" text-anchor="middle">vanilla JS</text>
  <text x="735" y="133" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf3" text-anchor="middle">.js chunks</text>
  <text x="735" y="155" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#7ee787" text-anchor="middle">~3 files</text>
  <text x="735" y="168" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#7ee787" text-anchor="middle">~180KB</text>

  <!-- Before/After -->
  <rect x="100" y="210" width="280" height="80" fill="#1c1e26" stroke="#ff7b72" stroke-width="1" rx="8"/>
  <text x="240" y="235" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#ff7b72" text-anchor="middle">Before (what you write)</text>
  <text x="115" y="258" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf3">const Button = ({label}: {label:</text>
  <text x="115" y="273" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf3">  string}) => <button>{label}</button></text>

  <rect x="420" y="210" width="280" height="80" fill="#1c1e26" stroke="#7ee787" stroke-width="1" rx="8"/>
  <text x="560" y="235" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#7ee787" text-anchor="middle">After (what browser runs)</text>
  <text x="435" y="258" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf3">const Button=({label})=>React</text>
  <text x="435" y="273" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf3">  .createElement("button",null,label)</text>

  <text x="400" y="335" font-family="ui-sans-serif,sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">Types stripped · JSX converted · Tree-shaken · Minified · Split</text>
  <text x="400" y="365" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#58a6ff" text-anchor="middle" font-style="italic">You write convenient code; the pipeline handles the rest</text>
</svg>