<svg xmlns="http://www.w3.org/2000.svg" width="800" height="380" viewBox="0 0 800 380">
  <rect width="800" height="380" fill="#0d1117" rx="16"/>
  <text x="400" y="35" font-family="ui-sans-serif,sans-serif" font-size="20" font-weight="bold" fill="#58a6ff" text-anchor="middle">React Ecosystem: Plug & Play Components</text>

  <!-- Your app -->
  <rect x="330" y="60" width="140" height="60" fill="#1c1e26" stroke="#58a6ff" stroke-width="2" rx="10"/>
  <text x="400" y="95" font-family="ui-monospace,monospace" font-size="14" fill="#58a6ff" text-anchor="middle">Your App</text>

  <!-- Lines down -->
  <line x1="400" y1="120" x2="150" y2="160" stroke="#30363d" stroke-width="2"/>
  <line x1="400" y1="120" x2="300" y2="160" stroke="#30363d" stroke-width="2"/>
  <line x1="400" y1="120" x2="450" y2="160" stroke="#30363d" stroke-width="2"/>
  <line x1="400" y1="120" x2="600" y2="160" stroke="#30363d" stroke-width="2"/>

  <!-- Libraries -->
  <rect x="60" y="160" width="180" height="80" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="8"/>
  <text x="150" y="190" font-family="ui-sans-serif,sans-serif" font-size="14" font-weight="bold" fill="#7ee787" text-anchor="middle">Material UI</text>
  <text x="150" y="210" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Comprehensive</text>
  <text x="150" y="225" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Google Material</text>

  <rect x="250" y="160" width="180" height="80" fill="#161b22" stroke="#bc8cff" stroke-width="2" rx="8"/>
  <text x="340" y="190" font-family="ui-sans-serif,sans-serif" font-size="14" font-weight="bold" fill="#bc8cff" text-anchor="middle">Chakra UI</text>
  <text x="340" y="210" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Simple, accessible</text>
  <text x="340" y="225" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Style props</text>

  <rect x="440" y="160" width="180" height="80" fill="#161b22" stroke="#f778ba" stroke-width="2" rx="8"/>
  <text x="530" y="190" font-family="ui-sans-serif,sans-serif" font-size="14" font-weight="bold" fill="#f778ba" text-anchor="middle">shadcn/ui</text>
  <text x="530" y="210" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Copy-paste, owned</text>
  <text x="530" y="225" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Radix + Tailwind</text>

  <rect x="630" y="160" width="120" height="80" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="8"/>
  <text x="690" y="190" font-family="ui-sans-serif,sans-serif" font-size="14" font-weight="bold" fill="#ffa657" text-anchor="middle">Mantine</text>
  <text x="690" y="210" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Hooks + UI</text>
  <text x="690" y="225" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Modern</text>

  <!-- Components inside -->
  <text x="400" y="275" font-family="ui-sans-serif,sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">Each library provides ready-made:</text>
  <g font-family="ui-monospace,monospace" font-size="12" text-anchor="middle">
    <rect x="80" y="295" width="100" height="35" fill="#1c1e26" stroke="#30363d" rx="6"/>
    <text x="130" y="317" fill="#7ee787"><Button/></text>
    <rect x="190" y="295" width="100" height="35" fill="#1c1e26" stroke="#30363d" rx="6"/>
    <text x="240" y="317" fill="#7ee787"><Modal/></text>
    <rect x="300" y="295" width="100" height="35" fill="#1c1e26" stroke="#30363d" rx="6"/>
    <text x="350" y="317" fill="#7ee787"><Table/></text>
    <rect x="410" y="295" width="110" height="35" fill="#1c1e26" stroke="#30363d" rx="6"/>
    <text x="465" y="317" fill="#7ee787"><DatePicker/></text>
    <rect x="530" y="295" width="100" height="35" fill="#1c1e26" stroke="#30363d" rx="6"/>
    <text x="580" y="317" fill="#7ee787"><Form/></text>
    <rect x="640" y="295" width="100" height="35" fill="#1c1e26" stroke="#30363d" rx="6"/>
    <text x="690" y="317" fill="#7ee787"><Tabs/></text>
  </g>
  <text x="400" y="360" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#58a6ff" text-anchor="middle" font-style="italic">Like a Lego set with pre-assembled kits</text>
</svg>