<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <rect width="800" height="420" fill="#0d1117" rx="16"/>
  <text x="400" y="35" font-family="ui-sans-serif,sans-serif" font-size="20" font-weight="bold" fill="#58a6ff" text-anchor="middle">Props vs State</text>

  <!-- Parent -->
  <rect x="300" y="60" width="200" height="80" fill="#1c1e26" stroke="#58a6ff" stroke-width="2" rx="10"/>
  <text x="400" y="90" font-family="ui-monospace,monospace" font-size="14" fill="#58a6ff" text-anchor="middle">Parent</text>
  <text x="400" y="112" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">owns: products (state)</text>
  <text x="400" y="128" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#7ee787" text-anchor="middle">↓ passes props down</text>

  <!-- Arrows to children -->
  <line x1="350" y1="140" x2="200" y2="175" stroke="#bc8cff" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="450" y1="140" x2="600" y2="175" stroke="#bc8cff" stroke-width="2" marker-end="url(#a3)"/>
  <defs><marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc8cff"/></marker></defs>

  <!-- Child A -->
  <rect x="100" y="180" width="200" height="80" fill="#1c1e26" stroke="#bc8cff" stroke-width="2" rx="10"/>
  <text x="200" y="210" font-family="ui-monospace,monospace" font-size="14" fill="#bc8cff" text-anchor="middle">Child A</text>
  <text x="200" y="232" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">receives: name (prop)</text>
  <text x="200" y="250" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#f778ba" text-anchor="middle">owns: liked (state)</text>

  <!-- Child B -->
  <rect x="500" y="180" width="200" height="80" fill="#1c1e26" stroke="#bc8cff" stroke-width="2" rx="10"/>
  <text x="600" y="210" font-family="ui-monospace,monospace" font-size="14" fill="#bc8cff" text-anchor="middle">Child B</text>
  <text x="600" y="232" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">receives: name (prop)</text>
  <text x="600" y="250" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#f778ba" text-anchor="middle">owns: cartCount (state)</text>

  <!-- Comparison table -->
  <rect x="80" y="290" width="300" height="110" fill="#161b22" stroke="#bc8cff" rx="8"/>
  <text x="230" y="315" font-family="ui-sans-serif,sans-serif" font-size="15" font-weight="bold" fill="#bc8cff" text-anchor="middle">Props</text>
  <text x="95" y="340" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#e6edf3">• Passed from parent ↓</text>
  <text x="95" y="358" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#e6edf3">• Read-only (child can't change)</text>
  <text x="95" y="376" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#e6edf3">• Like function arguments</text>
  <text x="95" y="394" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#e6edf3">• Changes come from above</text>

  <rect x="420" y="290" width="300" height="110" fill="#161b22" stroke="#f778ba" rx="8"/>
  <text x="570" y="315" font-family="ui-sans-serif,sans-serif" font-size="15" font-weight="bold" fill="#f778ba" text-anchor="middle">State</text>
  <text x="435" y="340" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#e6edf3">• Owned by the component</text>
  <text x="435" y="358" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#e6edf3">• Mutable by owner only</text>
  <text x="435" y="376" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#e6edf3">• Like local variables</text>
  <text x="435" y="394" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#e6edf3">• Triggers re-render on change</text>
</svg>