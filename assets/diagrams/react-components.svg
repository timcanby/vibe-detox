<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#0d1117" rx="16"/>
  <text x="400" y="35" font-family="ui-sans-serif,sans-serif" font-size="20" font-weight="bold" fill="#58a6ff" text-anchor="middle">Component = Function(props, state) → UI</text>

  <!-- Input boxes -->
  <rect x="40" y="80" width="140" height="50" fill="#161b22" stroke="#bc8cff" stroke-width="2" rx="8"/>
  <text x="110" y="110" font-family="ui-sans-serif,sans-serif" font-size="14" fill="#e6edf3" text-anchor="middle">props (input)</text>

  <rect x="40" y="150" width="140" height="50" fill="#161b22" stroke="#f778ba" stroke-width="2" rx="8"/>
  <text x="110" y="180" font-family="ui-sans-serif,sans-serif" font-size="14" fill="#e6edf3" text-anchor="middle">state (internal)</text>

  <!-- Arrow -->
  <line x1="190" y1="140" x2="290" y2="140" stroke="#30363d" stroke-width="3" marker-end="url(#arr)"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#30363d"/></marker></defs>

  <!-- Component box -->
  <rect x="300" y="80" width="200" height="120" fill="#1c1e26" stroke="#58a6ff" stroke-width="2" rx="10"/>
  <text x="400" y="115" font-family="ui-monospace,monospace" font-size="14" fill="#58a6ff" text-anchor="middle">Component()</text>
  <text x="400" y="140" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">markup + styles + logic</text>
  <text x="400" y="160" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">sealed together</text>
  <text x="400" y="185" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#7ee787" text-anchor="middle">reusable & testable</text>

  <!-- Arrow -->
  <line x1="510" y1="140" x2="610" y2="140" stroke="#30363d" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Output: Virtual DOM tree -->
  <rect x="620" y="60" width="60" height="40" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="650" y="85" font-family="ui-monospace,monospace" font-size="12" fill="#7ee787" text-anchor="middle"><div></text>
  <line x1="650" y1="100" x2="650" y2="120" stroke="#30363d" stroke-width="2"/>
  <rect x="590" y="120" width="60" height="40" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="620" y="145" font-family="ui-monospace,monospace" font-size="11" fill="#7ee787" text-anchor="middle"><h1></text>
  <rect x="660" y="120" width="60" height="40" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="690" y="145" font-family="ui-monospace,monospace" font-size="11" fill="#7ee787" text-anchor="middle"><p></text>
  <text x="650" y="185" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Virtual DOM tree</text>
  <text x="650" y="200" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">(diff-patched)</text>

  <!-- Composition row -->
  <text x="400" y="260" font-family="ui-sans-serif,sans-serif" font-size="16" font-weight="bold" fill="#bc8cff" text-anchor="middle">Composition</text>
  <rect x="250" y="280" width="100" height="50" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="8"/>
  <text x="300" y="310" font-family="ui-monospace,monospace" font-size="12" fill="#58a6ff" text-anchor="middle"><App></text>
  <line x1="350" y1="305" x2="380" y2="305" stroke="#30363d" stroke-width="2"/>
  <rect x="380" y="280" width="100" height="50" fill="#161b22" stroke="#bc8cff" stroke-width="2" rx="8"/>
  <text x="430" y="310" font-family="ui-monospace,monospace" font-size="12" fill="#bc8cff" text-anchor="middle"><Card></text>
  <rect x="510" y="280" width="100" height="50" fill="#161b22" stroke="#f778ba" stroke-width="2" rx="8"/>
  <text x="560" y="310" font-family="ui-monospace,monospace" font-size="12" fill="#f778ba" text-anchor="middle"><Button></text>
  <line x1="480" y1="305" x2="510" y2="305" stroke="#30363d" stroke-width="2"/>
  <text x="430" y="360" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Lego blocks — nest any component inside any other</text>
</svg>