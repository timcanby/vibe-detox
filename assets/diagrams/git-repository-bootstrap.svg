<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#0d1117" rx="16"/>
  <text x="400" y="35" font-family="ui-sans-serif,sans-serif" font-size="20" font-weight="bold" fill="#58a6ff" text-anchor="middle">Git Repository Bootstrap</text>

  <!-- Steps flow -->
  <rect x="30" y="65" width="130" height="55" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="95" y="88" font-family="ui-sans-serif,sans-serif" font-size="11" font-weight="bold" fill="#7ee787" text-anchor="middle">1. .gitignore</text>
  <text x="95" y="105" font-family="ui-sans-serif,sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">exclude secrets, deps</text>

  <rect x="180" y="65" width="130" height="55" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="245" y="88" font-family="ui-sans-serif,sans-serif" font-size="11" font-weight="bold" fill="#7ee787" text-anchor="middle">2. .env.example</text>
  <text x="245" y="105" font-family="ui-sans-serif,sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">template for devs</text>

  <rect x="330" y="65" width="130" height="55" fill="#161b22" stroke="#ffa657" stroke-width="2" rx="6"/>
  <text x="395" y="88" font-family="ui-sans-serif,sans-serif" font-size="11" font-weight="bold" fill="#ffa657" text-anchor="middle">3. rm nested .git</text>
  <text x="395" y="105" font-family="ui-sans-serif,sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">no sub-repos!</text>

  <rect x="480" y="65" width="130" height="55" fill="#161b22" stroke="#bc8cff" stroke-width="2" rx="6"/>
  <text x="545" y="88" font-family="ui-sans-serif,sans-serif" font-size="11" font-weight="bold" fill="#bc8cff" text-anchor="middle">4. git init -b main</text>
  <text x="545" y="105" font-family="ui-sans-serif,sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">create local repo</text>

  <rect x="630" y="65" width="140" height="55" fill="#161b22" stroke="#f778ba" stroke-width="2" rx="6"/>
  <text x="700" y="88" font-family="ui-sans-serif,sans-serif" font-size="11" font-weight="bold" fill="#f778ba" text-anchor="middle">5. git add + commit</text>
  <text x="700" y="105" font-family="ui-sans-serif,sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">first commit</text>

  <!-- Arrows -->
  <defs><marker id="ga2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#30363d"/></marker></defs>
  <line x1="160" y1="92" x2="180" y2="92" stroke="#30363d" stroke-width="1.5" marker-end="url(#ga2)"/>
  <line x1="310" y1="92" x2="330" y2="92" stroke="#30363d" stroke-width="1.5" marker-end="url(#ga2)"/>
  <line x1="460" y1="92" x2="480" y2="92" stroke="#30363d" stroke-width="1.5" marker-end="url(#ga2)"/>
  <line x1="610" y1="92" x2="630" y2="92" stroke="#30363d" stroke-width="1.5" marker-end="url(#ga2)"/>

  <!-- Step 6 -->
  <rect x="250" y="155" width="300" height="55" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="400" y="178" font-family="ui-sans-serif,sans-serif" font-size="11" font-weight="bold" fill="#58a6ff" text-anchor="middle">6. git remote add origin + git push -u origin main</text>
  <text x="400" y="195" font-family="ui-sans-serif,sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">connect to GitHub empty repo and push</text>

  <line x1="400" y1="125" x2="400" y2="155" stroke="#30363d" stroke-width="1.5" marker-end="url(#ga2)"/>

  <!-- Gitignore details -->
  <rect x="30" y="235" width="350" height="140" fill="#1c1e26" stroke="#ff7b72" stroke-width="1" rx="8"/>
  <text x="205" y="258" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="bold" fill="#ff7b72" text-anchor="middle">.gitignore (NOT committed)</text>
  <text x="45" y="280" font-family="ui-monospace,monospace" font-size="10" fill="#e6edf3">*.tfstate         # state files</text>
  <text x="45" y="296" font-family="ui-monospace,monospace" font-size="10" fill="#e6edf3">.env              # secrets</text>
  <text x="45" y="312" font-family="ui-monospace,monospace" font-size="10" fill="#e6edf3">node_modules/     # dependencies</text>
  <text x="45" y="328" font-family="ui-monospace,monospace" font-size="10" fill="#e6edf3">lambda_package.zip # build artifact</text>
  <text x="45" y="344" font-family="ui-monospace,monospace" font-size="10" fill="#e6edf3">.terraform/       # plugins</text>
  <text x="45" y="362" font-family="ui-monospace,monospace" font-size="10" fill="#7ee787">!.env.example     # DO commit</text>

  <rect x="420" y="235" width="350" height="140" fill="#1c1e26" stroke="#7ee787" stroke-width="1" rx="8"/>
  <text x="595" y="258" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="bold" fill="#7ee787" text-anchor="middle">DO commit to git</text>
  <text x="435" y="280" font-family="ui-monospace,monospace" font-size="10" fill="#e6edf3">.env.example      # template</text>
  <text x="435" y="296" font-family="ui-monospace,monospace" font-size="10" fill="#e6edf3">.gitignore        # itself</text>
  <text x="435" y="312" font-family="ui-monospace,monospace" font-size="10" fill="#e6edf3">*.tf              # Terraform code</text>
  <text x="435" y="328" font-family="ui-monospace,monospace" font-size="10" fill="#e6edf3">.terraform.lock.hcl # version lock</text>
  <text x="435" y="344" font-family="ui-monospace,monospace" font-size="10" fill="#e6edf3">terraform.tfvars  # default vars</text>
  <text x="435" y="362" font-family="ui-monospace,monospace" font-size="10" fill="#8b949e">all source code</text>
</svg>