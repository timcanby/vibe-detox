<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380">
  <rect width="800" height="380" fill="#0d1117" rx="16"/>
  <text x="400" y="35" font-family="ui-sans-serif,sans-serif" font-size="20" font-weight="bold" fill="#58a6ff" text-anchor="middle">JWT Structure</text>

  <!-- Token parts -->
  <rect x="50" y="70" width="220" height="60" fill="#161b22" stroke="#bc8cff" stroke-width="2" rx="6"/>
  <text x="160" y="95" font-family="ui-monospace,monospace" font-size="11" fill="#bc8cff" text-anchor="middle">eyJhbGciOiJIUzI1...</text>
  <text x="160" y="115" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Header (alg, type)</text>

  <text x="285" y="105" font-family="ui-sans-serif,sans-serif" font-size="20" fill="#30363d" text-anchor="middle">.</text>

  <rect x="300" y="70" width="240" height="60" fill="#161b22" stroke="#f778ba" stroke-width="2" rx="6"/>
  <text x="420" y="95" font-family="ui-monospace,monospace" font-size="11" fill="#f778ba" text-anchor="middle">eyJzdWIiOiJ1c2VyXzEy...</text>
  <text x="420" y="115" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Payload (claims)</text>

  <text x="555" y="105" font-family="ui-sans-serif,sans-serif" font-size="20" fill="#30363d" text-anchor="middle">.</text>

  <rect x="570" y="70" width="180" height="60" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="6"/>
  <text x="660" y="95" font-family="ui-monospace,monospace" font-size="11" fill="#7ee787" text-anchor="middle">SflKxwRJSMeK...</text>
  <text x="660" y="115" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Signature</text>

  <!-- Decoded -->
  <rect x="50" y="155" width="340" height="90" fill="#1c1e26" stroke="#f778ba" stroke-width="1" rx="8"/>
  <text x="220" y="178" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#f778ba" text-anchor="middle">Payload (decoded)</text>
  <text x="65" y="200" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf3">{"sub": "user_123",</text>
  <text x="65" y="216" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf3"> "iss": "clerk.accounts.dev",</text>
  <text x="65" y="232" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf3"> "exp": 1700000000}</text>

  <rect x="410" y="155" width="340" height="90" fill="#1c1e26" stroke="#7ee787" stroke-width="1" rx="8"/>
  <text x="580" y="178" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#7ee787" text-anchor="middle">Signature verification</text>
  <text x="425" y="200" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf3">HMAC(header + payload,</text>
  <text x="425" y="216" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf3">  public_key_from_JWKS)</text>
  <text x="425" y="232" font-family="ui-monospace,monospace" font-size="11" fill="#7ee787">== signature? ✓/✗</text>

  <!-- Warning -->
  <text x="400" y="280" font-family="ui-sans-serif,sans-serif" font-size="14" fill="#ff7b72" text-anchor="middle">⚠ Payload is base64 — anyone can READ it. Signature proves it wasn't TAMPERED with.</text>
  <text x="400" y="305" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Backend verifies signature with Clerk's public keys (JWKS URL) — no API call to Clerk needed</text>
  <text x="400" y="335" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#58a6ff" text-anchor="middle" font-style="italic">Like a passport: issued by Clerk, verified by anyone with the public key</text>
</svg>