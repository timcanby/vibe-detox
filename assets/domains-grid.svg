<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
  <rect width="900" height="480" fill="#0d1117" rx="16"/>
  <text x="450" y="40" font-family="ui-sans-serif,sans-serif" font-size="20" font-weight="bold" fill="#e6edf3" text-anchor="middle">Knowledge Domains</text>

  <!-- Row 1 -->
  <g font-family="ui-sans-serif,sans-serif" font-size="14" fill="#e6edf3" text-anchor="middle">
    <rect x="30" y="70" width="250" height="80" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="10"/>
    <text x="155" y="105" font-weight="bold">💻 Computer Science</text>
    <text x="155" y="125" font-size="11" fill="#8b949e">Algorithms, data structures, complexity</text>

    <rect x="325" y="70" width="250" height="80" fill="#161b22" stroke="#bc8cff" stroke-width="2" rx="10"/>
    <text x="450" y="105" font-weight="bold">📐 Mathematics</text>
    <text x="450" y="125" font-size="11" fill="#8b949e">Linear algebra, probability, discrete</text>

    <rect x="620" y="70" width="250" height="80" fill="#161b22" stroke="#f778ba" stroke-width="2" rx="10"/>
    <text x="745" y="105" font-weight="bold">⚙️ Programming</text>
    <text x="745" y="125" font-size="11" fill="#8b949e">Semantics, paradigms, memory models</text>
  </g>

  <!-- Row 2 -->
  <g font-family="ui-sans-serif,sans-serif" font-size="14" fill="#e6edf3" text-anchor="middle">
    <rect x="30" y="170" width="250" height="80" fill="#161b22" stroke="#ff7b72" stroke-width="2" rx="10"/>
    <text x="155" y="205" font-weight="bold">🔧 Backend</text>
    <text x="155" y="225" font-size="11" fill="#8b949e">Servers, APIs, concurrency, queues</text>

    <rect x="325" y="170" width="250" height="80" fill="#161b22" stroke="#d29922" stroke-width="2" rx="10"/>
    <text x="450" y="205" font-weight="bold">🗄️ Databases</text>
    <text x="450" y="225" font-size="11" fill="#8b949e">SQL/NoSQL, indexing, transactions</text>

    <rect x="620" y="170" width="250" height="80" fill="#161b22" stroke="#7ee787" stroke-width="2" rx="10"/>
    <text x="745" y="205" font-weight="bold">🌐 Networking</text>
    <text x="745" y="225" font-size="11" fill="#8b949e">TCP/IP, HTTP, DNS, load balancing</text>
  </g>

  <!-- Row 3 -->
  <g font-family="ui-sans-serif,sans-serif" font-size="14" fill="#e6edf3" text-anchor="middle">
    <rect x="30" y="270" width="250" height="80" fill="#161b22" stroke="#2ea043" stroke-width="2" rx="10"/>
    <text x="155" y="305" font-weight="bold">🖥️ Operating Systems</text>
    <text x="155" y="325" font-size="11" fill="#8b949e">Processes, memory, scheduling</text>

    <rect x="325" y="270" width="250" height="80" fill="#161b22" stroke="#1f6feb" stroke-width="2" rx="10"/>
    <text x="450" y="305" font-weight="bold">🏗️ Software Engineering</text>
    <text x="450" y="325" font-size="11" fill="#8b949e">Testing, patterns, architecture</text>

    <rect x="620" y="270" width="250" height="80" fill="#161b22" stroke="#8957e5" stroke-width="2" rx="10"/>
    <text x="745" y="305" font-weight="bold">🌐 Distributed Systems</text>
    <text x="745" y="325" font-size="11" fill="#8b949e">Consensus, replication, CAP</text>
  </g>

  <!-- Row 4 -->
  <g font-family="ui-sans-serif,sans-serif" font-size="14" fill="#e6edf3" text-anchor="middle">
    <rect x="30" y="370" width="250" height="80" fill="#161b22" stroke="#db61a2" stroke-width="2" rx="10"/>
    <text x="155" y="405" font-weight="bold">📊 System Design</text>
    <text x="155" y="425" font-size="11" fill="#8b949e">Scalability, trade-offs, architectures</text>

    <rect x="325" y="370" width="250" height="80" fill="#161b22" stroke="#e8872d" stroke-width="2" rx="10"/>
    <text x="450" y="405" font-weight="bold">🤖 Machine Learning</text>
    <text x="450" y="425" font-size="11" fill="#8b949e">Training, evaluation, optimization</text>

    <rect x="620" y="370" width="250" height="80" fill="#161b22" stroke="#f778ba" stroke-width="2" rx="10"/>
    <text x="745" y="405" font-weight="bold">✨ AI Engineering</text>
    <text x="745" y="425" font-size="11" fill="#8b949e">LLMs, RAG, embeddings, inference</text>
  </g>
</svg>